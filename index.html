<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Finanças</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root{--bg:#0b1020;--card:#141b34;--card2:#1b2447;--tx:#eef1ff;--mut:#8b95c9;--ac:#6c8cff;--ac2:#22d3ee;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1d2a66 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12px}
main{padding:8px 16px;max-width:620px;margin:auto}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid #ffffff12;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 8px 24px #0006}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:12px}
.k small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.k b{display:block;font-size:19px;margin-top:4px}
.big b{font-size:30px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff0d;gap:10px}
.row:last-child{border:0}.row .l{min-width:0}.row .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l span{color:var(--mut);font-size:12px}.row .r{text-align:right;white-space:nowrap}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700}
.Pago{background:#34d39922;color:var(--ok)}.Atrasado{background:#fb718522;color:var(--bad)}.Avencer,.Emaberto{background:#fbbf2422;color:var(--warn)}
h3{margin:0 0 6px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
label{display:block;margin-top:12px;color:var(--mut);font-size:12px}
input,select{width:100%;margin-top:5px;padding:13px;font-size:16px;color:var(--tx);background:#0d1330;border:1px solid #ffffff1c;border-radius:12px;outline:0}
input:focus,select:focus{border-color:var(--ac)}
button{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),#8b5cf6)}
button.sec{background:#ffffff10;border:1px solid #ffffff1c}
.mini{width:auto;margin:0;padding:8px 12px;font-size:12px;border-radius:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0b1020ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff12;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;color:var(--mut);font-size:11px;padding:6px;border-radius:12px;text-decoration:none}
nav a.on{color:#fff;background:#6c8cff30}nav a span{display:block;font-size:20px}
.pg{display:none}.pg.on{display:block}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#141b34;border:1px solid #ffffff22;display:none;z-index:9;font-weight:600}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:8}
.modal>div{background:var(--card);width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}
</style></head><body>
<div id="msg"></div>
<header><div><h1>Finanças</h1><div class="sub" id="sub">Conecte para sincronizar com a planilha</div></div><button id="login" class="mini">Entrar</button></header>
<main>
<section class="pg on" id="p-home">
 <div class="card"><div class="grid">
  <div class="k big" style="grid-column:span 2"><small>Saldo do mês (economia)</small><b id="kEco">-</b><div class="sub" id="kTaxa"></div></div>
  <div class="k"><small>Receitas</small><b class="pos" id="kRec">-</b></div>
  <div class="k"><small>Despesas</small><b class="neg" id="kDes">-</b></div>
  <div class="k"><small>A pagar</small><b id="kPag">-</b></div>
  <div class="k"><small>Em atraso</small><b id="kAtr">-</b></div></div>
  <div class="bar"><i id="bGasto" style="width:0"></i></div><div class="sub" style="margin-top:4px">Despesas / receitas do mês</div></div>
 <div class="card"><h3>Gastos por categoria</h3><div id="cats"></div></div>
</section>
<section class="pg" id="p-contas"><div class="card"><h3>Contas a pagar</h3><div id="contas"></div></div></section>
<section class="pg" id="p-novo"><div class="card"><h3>Novo lançamento</h3>
<form id="f">
<label>Natureza<select id="nat"></select></label>
<label>Descrição<input id="ds" required></label>
<label>Categoria<select id="cat" required></select></label>
<div id="gdesp"><label>Tipo de despesa<select id="tipo"></select></label><label>Classificação<select id="cla"></select></label></div>
<label>Valor (R$)<input type="number" step="0.01" min="0.01" inputmode="decimal" id="val" required></label>
<label>Data do lançamento<input type="date" id="dl" required></label>
<label>Vencimento<input type="date" id="ven" required></label>
<label>Data de pagamento (vazio se não pago)<input type="date" id="pag"></label>
<button type="submit" id="salvar">Salvar na planilha</button>
<button type="button" id="copiar" class="sec">Copiar linha (modo manual)</button></form></div></section>
<section class="pg" id="p-hist"><div class="card"><h3>Últimos lançamentos (toque para editar)</h3><div id="lista"></div></div></section>
</main>
<div class="modal" id="md"><div><h3>Editar lançamento</h3>
<label>Descrição<input id="eds"></label><label>Valor (R$)<input id="eval" type="number" step="0.01" inputmode="decimal"></label>
<label>Vencimento<input id="even" type="date"></label><label>Data de pagamento<input id="epag" type="date"></label>
<button id="esv">Salvar alterações</button><button class="sec" id="ecl">Cancelar</button></div></div>
<nav><a href="#" data-p="home" class="on"><span>◉</span>Painel</a><a href="#" data-p="contas"><span>⏰</span>Contas</a><a href="#" data-p="novo"><span>＋</span>Novo</a><a href="#" data-p="hist"><span>☰</span>Histórico</a></nav>
<script>
// ===== CONFIGURE AQUI =====
var CLIENT_ID= "12c73572-f32d-43b6-8599-de4b7fbbbb60";
var FILE_ID="DC05F443AA2E7B0B!s123ff52660fc4c63b71be9602a6c0299";
// ==========================
var G="https://graph.microsoft.com/v1.0/me/drive/items/"+encodeURIComponent(FILE_ID)+"/workbook",scopes=["Files.ReadWrite","User.Read"];
function $(i){return document.getElementById(i)}
function semCfg(){return CLIENT_ID.indexOf("12c73572-f32d-43b6-8599-de4b7fbbbb60")===0}
var app=semCfg()?null:new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.href.split("?")[0].split("#")[0]},cache:{cacheLocation:"localStorage"}});
var ROWS=[],cur=null;
function msg(t,e){var m=$("msg");m.textContent=t;m.style.color=e?"#fb7185":"#34d399";m.style.display="block";setTimeout(function(){m.style.display="none"},3500)}
async function token(){var a=app.getAllAccounts()[0];try{return(await app.acquireTokenSilent({scopes:scopes,account:a})).accessToken}catch(e){return(await app.loginPopup({scopes:scopes})).accessToken}}
async function api(p,m,b){var t=await token();var r=await fetch(G+p,{method:m||"GET",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}
function serial(s){if(!s)return"";var p=s.split("-");return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)+25569}
function iso(n){if(n===""||n==null)return"";return new Date((n-25569)*864e5).toISOString().slice(0,10)}
function br(n){if(n===""||n==null)return"";var s=iso(n);return s.slice(8)+"/"+s.slice(5,7)}
function brl(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fill(id,a){$(id).innerHTML=a.map(function(x){return"<option>"+x+"</option>"}).join("")}
function hoje(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
document.querySelectorAll("nav a").forEach(function(a){a.onclick=function(e){e.preventDefault();document.querySelectorAll("nav a,.pg").forEach(function(x){x.classList.remove("on")});a.classList.add("on");$("p-"+a.dataset.p).classList.add("on")}});
function isDesp(){return $("nat").value==="Despesa"}
function aplicaNat(){var d=isDesp();$("gdesp").style.display=d?"block":"none";if(!d){$("tipo").value="";$("cla").value=""}}
$("nat").onchange=aplicaNat;
function padroes(){$("dl").value=$("dl").value||hoje();$("ven").value=$("ven").value||hoje()}
async function listas(){var v=(await api("/worksheets('Cadastros')/range(address='A4:G30')?$select=values")).values;function c(i){return v.map(function(x){return x[i]}).filter(function(x){return x!==""})}
fill("cat",c(0));fill("tipo",[""].concat(c(2)));fill("cla",[""].concat(c(4)));fill("nat",c(6));padroes();aplicaNat()}
async function carregar(){var v=(await api("/tables('Lancamentos')/range?$select=values")).values;ROWS=[];
for(var i=1;i<v.length;i++){if(v[i][1]===""&&v[i][8]==="")continue;ROWS.push({i:i,r:v[i]})}render()}
function render(){var d=new Date(),A=d.getFullYear(),M=d.getMonth()+1,rec=0,des=0,pag=0,atr=0,cats={};
ROWS.forEach(function(o){var x=o.r,t=Number(x[11])||0;if(x[13]==A&&x[14]==M){if(x[2]==="Receita")rec+=t;else{des+=t;cats[x[3]]=(cats[x[3]]||0)+t}}
if(x[2]==="Despesa"&&x[7]===""&&x[12]!==""){pag+=t;if(x[12]==="Atrasado")atr+=t}});
var eco=rec-des;$("kEco").textContent=brl(eco);$("kEco").className=eco<0?"neg":"pos";$("kRec").textContent=brl(rec);$("kDes").textContent=brl(des);$("kPag").textContent=brl(pag);$("kAtr").textContent=brl(atr);
$("kTaxa").textContent=rec?"Taxa de poupança: "+(eco/rec*100).toFixed(1)+"%":"Sem receitas lançadas no mês";
$("bGasto").style.width=Math.min(100,rec?des/rec*100:(des?100:0))+"%";
var arr=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).slice(0,8),mx=arr.length?cats[arr[0]]:1;
$("cats").innerHTML=arr.map(function(k){return"<div class='row' style='display:block'><div style='display:flex;justify-content:space-between'><span>"+k+"</span><b>"+brl(cats[k])+"</b></div><div class='bar'><i style='width:"+cats[k]/mx*100+"%'></i></div></div>"}).join("")||"<div class='sub'>Sem despesas no mês.</div>";
var ab=ROWS.filter(function(o){return o.r[2]==="Despesa"&&o.r[7]===""}).sort(function(a,b){return a.r[6]-b.r[6]}).slice(0,25);
$("contas").innerHTML=ab.map(function(o){return item(o,true)}).join("")||"<div class='sub'>Nenhuma conta em aberto 🎉</div>";
$("lista").innerHTML=ROWS.slice(-30).reverse().map(function(o){return item(o,false)}).join("");
$("sub").textContent="Sincronizado • "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function item(o,pg){var x=o.r,s=x[12]||"";return"<div class='row'><div class='l' onclick='edit("+o.i+")'><b>"+x[1]+"</b><span>Venc. "+br(x[6])+" • "+x[3]+"</span></div><div class='r'><b class='"+(x[2]==="Receita"?"pos":"")+"'>"+brl(x[11])+"</b><span class='tag "+s.replace(/ /g,"")+"'>"+s+"</span>"+(pg&&!x[7]?" <button class='mini' onclick='pagar("+o.i+")'>Pagar</button>":"")+"</div></div>"}
async function pagar(i){try{await api("/worksheets('Lançamentos')/range(address='H"+(4+i)+"')","PATCH",{values:[[serial(hoje())]]});msg("Pagamento registrado ✓");carregar()}catch(e){msg("Erro: "+e.message,true)}}
function edit(i){var o=ROWS.filter(function(r){return r.i===i})[0];if(!o||!app)return;cur=i;var x=o.r;$("eds").value=x[1];$("eval").value=x[8];$("even").value=iso(x[6]);$("epag").value=iso(x[7]);$("md").style.display="flex"}
$("ecl").onclick=function(){$("md").style.display="none"};
$("esv").onclick=async function(){try{var r=4+cur;
await api("/worksheets('Lançamentos')/range(address='B"+r+"')","PATCH",{values:[[$("eds").value]]});
await api("/worksheets('Lançamentos')/range(address='G"+r+":I"+r+"')","PATCH",{values:[[serial($("even").value),serial($("epag").value),parseFloat($("eval").value)]]});
$("md").style.display="none";msg("Alterado ✓");carregar()}catch(e){msg("Erro: "+e.message,true)}};
$("f").onsubmit=async function(ev){ev.preventDefault();if(!app)return;try{var l=[serial($("dl").value),$("ds").value,$("nat").value,$("cat").value,isDesp()?$("tipo").value:"",isDesp()?$("cla").value:"",serial($("ven").value),serial($("pag").value),parseFloat($("val").value)];
await api("/tables('Lancamentos')/rows/add","POST",{index:null,values:[l]});msg("Salvo na planilha ✓");$("f").reset();padroes();aplicaNat();carregar()}catch(e){msg("Erro: "+e.message,true)}};
function f2(s){return s?s.split("-").reverse().join("/"):""}
$("copiar").onclick=function(){if(!$("f").reportValidity())return;var t=[f2($("dl").value),$("ds").value,$("nat").value,$("cat").value,isDesp()?$("tipo").value:"",isDesp()?$("cla").value:"",f2($("ven").value),f2($("pag").value),String($("val").value).replace(".",",")].join("\t");navigator.clipboard?navigator.clipboard.writeText(t).then(function(){msg("Linha copiada ✓")}):prompt("Copie:",t)};
async function iniciar(){try{await token();$("login").style.display="none";await listas();await carregar()}catch(e){msg("Erro: "+e.message,true)}}
$("login").onclick=function(){if(!app){msg("Configure o CLIENT_ID no index.html",true);return}iniciar()};
if(semCfg()){fill("nat",["Receita","Despesa"]);fill("cat",["Moradia","Salario","Despesa Familiar","Despesas Obrigatorias","Despesas Ocasionais"]);fill("tipo",["","Renda Fixa","Renda Variável"]);fill("cla",["","Passivo Circulante","Passivo Não Circulante"]);padroes();aplicaNat();$("sub").textContent="Modo manual (sem CLIENT_ID)"}
else app.initialize().then(function(){if(app.getAllAccounts().length)iniciar()});
</script></body></html>
